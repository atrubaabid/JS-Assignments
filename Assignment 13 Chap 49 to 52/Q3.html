<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Details</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        #editForm {
            display: none;
            margin-top: 20px;
            border: 1px solid black;
            padding: 15px;
            width: 50%;
        }
    </style>
</head>
<body>

<h2>Student Registration Form</h2>

<form id="studentForm">
    Name: <input type="text" id="name" required>
    Roll No: <input type="text" id="roll" required>
    Class: <input type="text" id="class" required>
    <button type="submit">Add Student</button>
</form>

<table id="studentTable">
    <thead>
        <tr>
            <th>Name</th>
            <th>Roll No</th>
            <th>Class</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<!-- Hidden Edit Form -->
<div id="editForm">
    <h3>Edit Student Details</h3>
    Name: <input type="text" id="editName"><br><br>
    Roll No: <input type="text" id="editRoll"><br><br>
    Class: <input type="text" id="editClass"><br><br>
    <button onclick="updateStudent()">Update</button>
</div>

<script>
    let selectedRow = null;

    document.getElementById("studentForm").addEventListener("submit", function(e) {
        e.preventDefault();

        let name = document.getElementById("name").value;
        let roll = document.getElementById("roll").value;
        let className = document.getElementById("class").value;

        let table = document.getElementById("studentTable").getElementsByTagName("tbody")[0];
        let row = table.insertRow();

        row.insertCell(0).innerText = name;
        row.insertCell(1).innerText = roll;
        row.insertCell(2).innerText = className;
        row.insertCell(3).innerHTML = 
            `<button onclick="editRow(this)">Edit</button>
             <button onclick="deleteRow(this)">Delete</button>`;

        this.reset();
    });

    function deleteRow(btn) {
        btn.parentElement.parentElement.remove();
    }

    function editRow(btn) {
        selectedRow = btn.parentElement.parentElement;
        document.getElementById("editName").value = selectedRow.cells[0].innerText;
        document.getElementById("editRoll").value = selectedRow.cells[1].innerText;
        document.getElementById("editClass").value = selectedRow.cells[2].innerText;
        document.getElementById("editForm").style.display = "block";
    }

    function updateStudent() {
        selectedRow.cells[0].innerText = document.getElementById("editName").value;
        selectedRow.cells[1].innerText = document.getElementById("editRoll").value;
        selectedRow.cells[2].innerText = document.getElementById("editClass").value;
        document.getElementById("editForm").style.display = "none";
    }
</script>

</body>
</html>
